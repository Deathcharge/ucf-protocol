name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src tests examples
      - name: Lint
        run: ruff check src tests examples
      - name: Type-check
        run: mypy src
      - name: Test with branch coverage
        run: pytest

  distribution:
    name: Distribution smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build and inspect metadata
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install and exercise the wheel
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install dist/*.whl
          smoke-venv/bin/ucf --version
          smoke-venv/bin/ucf --database smoke.db record --event-id smoke-1 --harmony 0.6 --resilience 0.7 --throughput 0.7 --focus 0.8 --friction 0.2 --velocity 0.6
          smoke-venv/bin/ucf --database smoke.db status --json
          smoke-venv/bin/python -c "from importlib.resources import files; assert files('ucf_protocol').joinpath('schemas/ucf-state-v1.schema.json').is_file()"
      - name: Run the shipped example
        run: smoke-venv/bin/python examples/basic_journey.py --database example-smoke.db
