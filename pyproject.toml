[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "ucf-protocol"
version = "1.0.0rc1"
description = "Local-first coordination health observations, journal, and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Samsarix LLC", email = "contact@samsarix.com"},
]
keywords = ["coordination", "telemetry", "sqlite", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "jsonschema[format]>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "twine>=6,<7",
]

[project.scripts]
ucf = "ucf_protocol.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Deathcharge/ucf-protocol"
Issues = "https://github.com/Deathcharge/ucf-protocol/issues"
Repository = "https://github.com/Deathcharge/ucf-protocol.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucf_protocol = ["py.typed", "schemas/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --tb=short -ra --cov=ucf_protocol --cov-branch --cov-report=term-missing"
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ucf_protocol"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src/ucf_protocol"]
python_version = "3.10"
strict = true
warn_unreachable = true
